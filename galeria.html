<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rutes en bici · Bicis Tramuntana</title>
    <link rel="stylesheet" href="/css/galeria.css">
</head>

<body>
    <header>
        <h1>Bicis Tramuntana</h1>
        <p class="banner">Lloga la bici per a qualsevol d'aquestes rutes: 15 € el dia</p>
    </header>

    <main>
        <h2>Rutes en bici per Mallorca</h2>

        <div class="galeria">
            <figure>
                <img src="img/sa_calobra.jpg" alt="Carretera de revolts entre penya-segats de la serra de Tramuntana">
                <figcaption>Sa Calobra <span class="km">· 38 km</span></figcaption>
            </figure>

            <figure>
                <img src="img/formentor.jpg" alt="Fars al cap de Formentor sobre un penya-segat davant la mar">
                <figcaption>Cap de Formentor <span class="km">· 42 km</span></figcaption>
            </figure>
        </div>
    </main>

    <footer>
        <p>Fet per Alonso Valentino Gottschling</p>
    </footer>
</body>

</html>
