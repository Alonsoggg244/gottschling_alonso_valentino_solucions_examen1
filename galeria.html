<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rutes en bici · Bicis Tramuntana</title>
    <link rel="stylesheet" href="/css/galeria.css">
</head>

<body>
    <header>
        <h1>Bicis Tramuntana</h1>
        <p class="banner">Lloga la bici per a qualsevol d'aquestes rutes: 15 € el dia</p>
    </header>

    <main>
        <h2>Rutes en bici per Mallorca</h2>

        <div class="galeria">
            <figure>
                <img src="img/sa_calobra.jpg" alt="Carretera de revolts entre penya-segats de la serra de Tramuntana">
                <figcaption>Sa Calobra <span class="km">· 38 km</span></figcaption>
            </figure>

            <figure>
                <img src="img/formentor.jpg" alt="Fars al cap de Formentor sobre un penya-segat davant la mar">
                <figcaption>Cap de Formentor <span class="km">· 42 km</span></figcaption>
            </figure>

            <figure>
                <img src="img/valldemossa.jpg" alt="Carrer empedrat del poble amb l'església i la serra al darrere">
                <figcaption>Valldemossa <span class="km">· 30 km</span></figcaption>
            </figure>

            <figure>
                <img src="img/port_soller.jpg" alt="Baia en forma de mitja lluna amb vaixells i el poble vora la mar">
                <figcaption>Port de Sóller <span class="km">· 25 km</span></figcaption>
            </figure>
            <figure>
                <img src="img/es_trenc.jpg" alt="Platja de sorra blanca amb passarel·la de fusta i turons verd al fons">
                <figcaption>Es Trenc <span class="km">· 28 km</span></figcaption>
            </figure>

            <figure>
                <img src="img/lluc.jpg" alt="Santuari de pedra amb façana barroca envoltat d'alzines i muntanya">
                <figcaption>Santuari de Lluc <span class="km">· 45 km</span></figcaption>
            </figure>

            <figure>
                <img src="img/pollenca.jpg" alt="Pont de pedra de set arcs sobre un riu sec amb serra darrere">
                <figcaption>Pont romà de Pollença <span class="km">· 20 km</span></figcaption>
            </figure>

            <figure>
                <img src="img/salines.jpg" alt="Salines rosades amb flamencs rosejats i la mar turquesa al fons">
                <figcaption>Ses Salines <span class="km">· 32 km</span></figcaption>
            </figure>

            <figure>
                <img src="img/ametllers.jpg" alt="Camí de terra entre ametllers en flor blanc i rosa amb mur de pedra">
                <figcaption>Els ametllers en flor <span class="km">· 35 km</span></figcaption>
            </figure>
        </div>
    </main>

    <footer>
        <p>Fet per Alonso Valentino Gottschling</p>
    </footer>
    
</body>

</html>
